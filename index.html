<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chemistry Around You</title>
<meta name="description" content="From Zero to Chemistry Hero: a free, friendly chemistry hub for learners with no science background, by Dr. NAM.">
<meta name="theme-color" content="#060d1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/logo-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)} img{max-width:100%} [hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;700;800&family=Questrial&display=swap">
<style>
/* Layout: one centred learning column; a journey map of sticker cards, and each stop as tabbed layers (Core, Activity, Go deeper, Side trip, Self-check).
   Brand: Dr. NAM "Playful" style, Night teal & navy (default) with a Day sky-blue theme. */
:root{
  --ground:#060d1b; --text:#e3eef8; --muted:#a9bed3; --panel:#0c1a30; --line:#1d3352;
  --teal:#0d7f74; --aqua:#5eead4; --glow:#2dd4bf; --coral:#fc7a7a;
  --lime:#d4ff3a; --on-lime:#0a1628; --sticker:#ffffff; --ink:#231f20; --shadow:#d4ff3a;
  --title:#5eead4; --sticker-sub:#4a4560; --pop:#d4ff3a;
  --f-title:"League Spartan","Arial Black",system-ui,sans-serif;
  --f-body:"Questrial","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --ground:#f0f6ff; --text:#3b365f; --muted:#5d5880; --panel:#ffffff; --line:#cfdcef;
  --teal:#0d7f74; --aqua:#0d7f74; --glow:#14b8a6; --coral:#d9534f;
  --lime:#c8f53d; --on-lime:#0a1628; --shadow:#231f20; --title:#0d7f74; --pop:#0d7f74; color-scheme:light } }
:root[data-theme="light"]{
  --ground:#f0f6ff; --text:#3b365f; --muted:#5d5880; --panel:#ffffff; --line:#cfdcef;
  --teal:#0d7f74; --aqua:#0d7f74; --glow:#14b8a6; --coral:#d9534f;
  --lime:#c8f53d; --on-lime:#0a1628; --shadow:#231f20; --title:#0d7f74; --pop:#0d7f74; color-scheme:light }

*{box-sizing:border-box}
html{background:var(--ground)}
body{background:var(--ground);color:var(--text);font-family:var(--f-body);font-size:clamp(18px,1.2vw + 12px,22px);line-height:1.55;margin:0;overflow-x:hidden}
#doodles{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.16}
#doodles svg{position:absolute;width:64px;height:64px;stroke:var(--aqua);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
h1,h2,h3{font-family:var(--f-title);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(40px,6vw,72px)}
h2{font-size:clamp(30px,4vw,46px);color:var(--title)}
h3{font-size:clamp(22px,2.4vw,28px)}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-title);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.72em;color:var(--pop)}
.rule{width:84px;height:6px;background:var(--lime);border-radius:3px}

.logo{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid var(--ink);object-fit:cover;flex:none}
.avatar{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:#fff;object-fit:cover;flex:none;box-shadow:3px 3px 0 var(--shadow)}
.herologo{width:clamp(140px,22vw,200px);height:auto;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--shadow)}
/* Home button + badges */
.btn.homebtn{display:inline-flex;align-items:center;gap:8px;font-size:1.02em;min-height:54px;padding:.45em 1.1em}
.btn.homebtn svg{flex:none}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:6px}
.badge-item{margin:0;display:grid;justify-items:center;gap:6px;text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 8px}
.badge-item.earned{border-color:var(--lime)}
.badge-item.locked svg{opacity:.7}
.badge-item figcaption{display:grid;gap:2px;font-size:.78em}
.badge-item b{font-family:var(--f-title)}
.badge-item span{color:var(--muted);font-size:.9em}
.badge-won{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.badge-won div{display:grid;gap:2px}
.badge-won b{font-family:var(--f-title);font-size:1.2em;color:var(--pop)}
.badge-won.new svg{animation:badgepop .8s cubic-bezier(.2,.8,.3,1.4) both}
@keyframes badgepop{0%{transform:scale(.3) rotate(-20deg);opacity:0}70%{transform:scale(1.12) rotate(6deg);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion: reduce){ .badge-won.new svg{animation:none} }
/* Welcome back + % */
.wb{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--ground) 70%,transparent);border:2px solid var(--lime);border-radius:20px;padding:14px 16px;color:var(--text)}
.wb div{display:grid;gap:3px;min-width:0;flex:1}
.wb b{font-family:var(--f-title);font-size:1.15em}
.minibar{display:block;height:8px;border-radius:99px;background:#e6edf5;border:1.5px solid var(--ink);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--teal)}
/* Completed stamp on stop cards */
.stop{position:relative}
.stop .stamp{position:absolute;bottom:6px;right:10px;transform:rotate(14deg);filter:drop-shadow(3px 3px 0 var(--ink));animation:stampin .55s cubic-bezier(.2,.8,.3,1.4) both;pointer-events:none}
.stop.done{background:#f4ffe0;padding-right:86px}
@keyframes stampin{0%{transform:scale(2.2) rotate(-20deg);opacity:0}70%{transform:scale(.92) rotate(18deg);opacity:1}100%{transform:rotate(14deg)}}
@media (prefers-reduced-motion: reduce){ .stop .stamp{animation:none} }
/* Branded footer */
.credit{display:flex;gap:12px;align-items:center;border-top:2px dashed var(--line);padding-top:12px;margin-top:4px;text-transform:uppercase;letter-spacing:.05em;font-size:.92em;line-height:1.6}
.credit img{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--ink);flex:none}
.credit b{font-family:var(--f-title);color:var(--text);letter-spacing:.04em}
.credit p{margin:0;min-width:0}
/* Clickable title + Balance It */
.brandbtn{font:inherit;font-family:var(--f-title);font-weight:800;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.01em;line-height:1;color:var(--text);background:none;border:0;padding:0;text-align:left;cursor:pointer}
.brandbtn:hover{color:var(--pop);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.brandbtn:focus-visible{outline:4px solid var(--lime);outline-offset:3px;border-radius:6px}
.eqrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.eqrow .sp{display:grid;justify-items:center;gap:4px;background:var(--ground);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.eqrow .sp .n{font-family:var(--f-title);font-weight:800;font-size:1.4em;min-width:1.6ch;text-align:center;color:var(--pop)}
.eqrow .fm{font-family:var(--f-title);font-size:1.3em}
.eqrow .op{font-family:var(--f-title);font-weight:800;font-size:1.4em}
.eqrow .arrow{color:var(--pop)}
.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally .tl{display:grid;grid-template-columns:auto auto auto auto;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:.85em}
.tally .tl b{font-family:var(--f-title);font-size:1.1em}
.tally .tl.ok{border-color:var(--lime)} .tally .tl.no{border-color:var(--coral)}
.tally .tl i{font-style:normal;font-weight:800}
/* Concentration Room */
.concbox{color:var(--text);background:var(--ground);border:2px solid var(--line);border-radius:14px;padding:8px}
.concrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.concrow .pm{display:flex;gap:6px;align-items:center}
.concrow .n{font-family:var(--f-title);font-weight:800;font-size:1.4em;min-width:2ch;text-align:center;color:var(--pop)}
.concval{font-size:.88em;line-height:1.5}
.spgrp{margin:.55em 0;font-size:.85em}.spopts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.spmeter{height:10px;border:2px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 4px}.spmeter i{display:block;height:100%;background:linear-gradient(90deg,#5eead4,#d4ff3a,#fc7a7a)}
.bub{animation:bubUp 2s linear infinite;transform-box:fill-box}@keyframes bubUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-72px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}
.labcard{background:var(--ground);border:2px solid var(--line);border-radius:14px;padding:10px;color:var(--text)}.labwho{display:flex;flex-direction:column;gap:2px;font-size:.88em}
.labrow{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:baseline;width:100%;text-align:left;font:inherit;font-size:.82em;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:8px 10px 4px;margin-top:8px;cursor:pointer}.labrow svg{grid-column:1/-1}.labrow.hit{border-color:var(--lime);box-shadow:inset 0 0 0 2px var(--lime)}.labrow:disabled{cursor:default}
.ordwrap{display:flex;gap:12px;align-items:flex-start;color:var(--text)}.ordglass{display:flex;flex-direction:column;align-items:center;font-size:.75em;flex:none}
.ordlist{margin:0;padding-left:1.3em;font-size:.82em;display:flex;flex-direction:column;gap:6px}.ordlist li span{display:block;opacity:.85;font-size:.92em}
.ordpool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip.shake{animation:shake .4s ease;border-color:var(--coral)}
/* Reset progress */
.reset-slot{display:flex;justify-content:flex-end;font-size:.78em}
.reset-ask{display:grid;gap:8px;width:100%;background:var(--panel);border:2px solid var(--coral);border-radius:16px;padding:12px 14px}
.reset-ask b{font-family:var(--f-title)}
/* About-you pop-up */
dialog.about{border:3px solid var(--ink);border-radius:24px;padding:0;background:var(--sticker);color:var(--ink);box-shadow:8px 8px 0 var(--shadow);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;animation:dlgpop .45s cubic-bezier(.2,.8,.3,1.25) both}
dialog.about::backdrop{background:rgba(6,13,27,.62);backdrop-filter:blur(3px)}
dialog.about.closing{animation:dlgout .22s ease-in both}
.about-in{padding:20px;display:grid;gap:16px}
.about-head{display:flex;gap:12px;align-items:center}
.about-head h3{color:var(--ink);font-size:1.25em}
.about .eyebrow{color:var(--teal)}
.about .muted{color:var(--sticker-sub)}
.about-q{display:grid;gap:8px}
.about-q b{font-family:var(--f-title)}
.about .chip{background:#f3f7fb;color:var(--ink);border-color:#cfdcef}
.about .chip[aria-pressed="true"]{background:var(--lime);color:var(--on-lime);border-color:var(--ink)}
@keyframes dlgpop{0%{opacity:0;transform:translateY(24px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes dlgout{to{opacity:0;transform:scale(.96)}}
@media (prefers-reduced-motion: reduce){ dialog.about,dialog.about.closing{animation:none} }
/* Header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px}
.badge{width:58px;height:58px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;flex:none;text-align:center;font-family:var(--f-title);font-weight:800;font-size:12px;line-height:1;color:var(--ink);position:relative}
.badge small{display:block;font-size:8px;font-weight:400;font-family:var(--f-body);color:#666;margin-top:2px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-title);font-weight:800;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.01em;line-height:1}
.brand span{font-size:.7em;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* Sticker buttons */
.btn{font:inherit;font-family:var(--f-title);font-weight:700;font-size:.9em;background:var(--sticker);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:.5em 1em;box-shadow:5px 5px 0 var(--shadow);cursor:pointer;transform:rotate(-1.5deg);transition:transform .15s,box-shadow .15s;min-height:48px}
.btn:nth-of-type(even){transform:rotate(1.5deg)}
.btn:hover{transform:rotate(0) translateY(-3px)}
.btn:active{transform:translate(4px,4px) rotate(0);box-shadow:1px 1px 0 var(--shadow)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.flip:focus-visible,.mcard:focus-visible,.bin:focus-visible,.face:focus-visible{outline:4px solid var(--lime);outline-offset:3px}
.btn.lime{background:var(--lime);color:var(--on-lime)}
.btn.small{font-size:.75em;min-height:40px;padding:.35em .8em;box-shadow:3px 3px 0 var(--shadow)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line);box-shadow:none;transform:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Dr NAM says */
.says{display:flex;gap:12px;align-items:flex-start;margin-block:18px}
.says .bubble{background:var(--sticker);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:.7em 1em;position:relative;box-shadow:4px 4px 0 var(--shadow);flex:1;min-width:0}
.says .bubble b{font-family:var(--f-title);display:block;font-size:.8em;color:var(--teal);letter-spacing:.04em}
.says .badge{width:52px;height:52px}

/* Welcome */
.hero{display:grid;gap:22px;padding-block:28px 12px}
.hero h1 span{color:var(--pop)}
.hero p.lead{font-size:1.1em;max-width:34em}
.pick{display:grid;gap:10px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.8em;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:999px;padding:.35em .9em;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--on-lime);border-color:var(--ink);font-weight:700}
.notice{border:2px dashed var(--line);border-radius:16px;padding:.8em 1em;font-size:.8em;display:grid;gap:8px}

/* Journey */
.journey{display:grid;gap:8px;margin-block:18px}
.bar{height:16px;border-radius:999px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:999px;transition:width .5s}
.journey .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.82em}
.stops{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin-top:14px}
.stop{background:var(--sticker);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:16px 18px;box-shadow:6px 6px 0 var(--shadow);cursor:pointer;text-align:left;font:inherit;display:grid;gap:6px;transition:transform .15s;min-width:0}
.stop:nth-child(odd){transform:rotate(-1.4deg)} .stop:nth-child(even){transform:rotate(1.2deg)}
.stop:hover{transform:rotate(0) translateY(-4px)}
.stop .num{font-family:var(--f-title);font-weight:800;font-size:15px;background:var(--lime);color:var(--on-lime);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;justify-self:start}
.stop h3{color:var(--ink)}
.stop p{font-size:.8em;color:var(--sticker-sub)}
.stop .state{font-size:.72em;font-weight:700;font-family:var(--f-title);color:var(--teal)}
.stop.glow{box-shadow:6px 6px 0 var(--shadow),0 0 0 4px var(--ground),0 0 28px 6px var(--glow)}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.soon div{border:2px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:.8em;color:var(--muted)}
.soon b{color:var(--text);font-family:var(--f-title);display:block;font-size:1.1em}
section.block{margin-top:34px;display:grid;gap:6px}

/* Stop view */
.stophead{display:grid;gap:10px;padding-block:20px 6px}
.hook{font-size:1.15em;border-left:6px solid var(--lime);padding-left:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-block:16px 6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);padding-block:8px;z-index:3}
.tab{font:inherit;font-family:var(--f-title);font-weight:700;font-size:.78em;border:2px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:.4em .85em;cursor:pointer;min-height:44px}
.tab[aria-selected="true"]{background:var(--lime);color:var(--on-lime);border-color:var(--ink)}
.tab .tick{color:var(--teal)}
.tab[aria-selected="true"] .tick{color:var(--on-lime)}
.layer{display:grid;gap:18px;margin-top:10px}
.layer > p.intro{color:var(--muted);max-width:40em}

/* Flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.flip{font:inherit;text-align:left;background:none;border:0;padding:0;cursor:pointer;perspective:1200px;min-height:300px;color:inherit;width:100%}
.flip .in{position:relative;width:100%;height:100%;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face2{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.front{background:var(--sticker);color:var(--ink);box-shadow:6px 6px 0 var(--shadow)}
.back{background:var(--teal);color:#f2fffc;transform:rotateY(180deg);box-shadow:6px 6px 0 var(--shadow)}
.face2 .k{font-family:var(--f-title);font-weight:700;font-size:.7em;letter-spacing:.1em;text-transform:uppercase}
.front .k{color:var(--teal)} .back .k{color:var(--lime)}
.face2 h3{font-size:1.25em}
.face2 p{font-size:.88em}
.face2 .limit{font-size:.78em;border-top:2px dashed rgba(255,255,255,.4);padding-top:8px;margin-top:auto}
.face2 .tap{font-size:.7em;margin-top:auto;color:var(--sticker-sub)}

/* Activities */
.act{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px;min-width:0}
.act h3{color:var(--title)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.item{font:inherit;font-size:.85em;background:var(--sticker);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:.35em .8em;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);min-height:46px}
.item[aria-pressed="true"]{background:var(--lime);color:var(--on-lime);transform:translateY(-3px)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bin{font:inherit;color:var(--text);background:transparent;border:3px dashed var(--line);border-radius:18px;padding:12px;min-height:130px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.bin b{font-family:var(--f-title);font-size:1.05em}
.bin .got{display:flex;flex-wrap:wrap;gap:6px}
.bin .got span{font-size:.72em;background:var(--lime);color:var(--on-lime);border-radius:8px;padding:2px 8px}
.bin.ready{border-color:var(--lime)}
.fb{border-radius:14px;padding:.6em .9em;font-size:.85em;border:3px solid transparent}
.fb.ok{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 14%,transparent)}
.fb.no{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent)}
.fb.info{border-color:var(--line)}
.fb strong{font-family:var(--f-title)}

/* Memory match */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mcard{font:inherit;aspect-ratio:1/1;max-width:100%;border:3px solid var(--ink);border-radius:14px;background:var(--teal);color:#fff;font-family:var(--f-title);font-weight:800;font-size:clamp(14px,2.6vw,24px);cursor:pointer;display:grid;place-items:center;padding:4px;box-shadow:3px 3px 0 var(--shadow);overflow:hidden;word-break:break-word}
.mcard.up{background:var(--sticker);color:var(--ink)}
.mcard.done{background:var(--lime);color:var(--on-lime);cursor:default}

/* Atom builder */
.atomwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.atomwrap svg{width:100%;max-width:340px;justify-self:center}
.ctr{display:grid;gap:10px}
.ctr .r{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--ground);border:2px solid var(--line);border-radius:14px;padding:6px 10px}
.ctr .r b{font-family:var(--f-title)}
.ctr .r .n{font-family:var(--f-title);font-weight:800;font-size:1.4em;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.pm{display:flex;gap:6px}

/* Self-check */
.q{display:grid;gap:12px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;background:var(--panel);color:var(--text);border:3px solid var(--line);border-radius:14px;padding:.55em .9em;cursor:pointer;min-height:50px}
.opt[aria-pressed="true"]{border-color:var(--lime)}
.opt.ok{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 16%,transparent)}
.opt.no{border-color:var(--coral);text-decoration:line-through;opacity:.7}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:.78em;flex-wrap:wrap}
.score{font-family:var(--f-title);font-weight:800;color:var(--pop)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Feedback */
.faces{display:flex;gap:8px;flex-wrap:wrap}
.face{font:inherit;font-size:1.6em;width:60px;height:60px;border-radius:50%;border:3px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center}
.face[aria-pressed="true"]{border-color:var(--lime);background:var(--lime)}
.nums{display:flex;gap:6px;flex-wrap:wrap}
.nums .chip{min-width:46px;text-align:center}
textarea{font:inherit;font-size:.85em;width:100%;min-height:80px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);padding:.6em .8em}
label.q2{font-family:var(--f-title);font-weight:700;font-size:.9em}
.form{display:grid;gap:20px}

/* Lecturer */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{font-family:var(--f-title);font-size:1.8em;display:block;color:var(--pop);font-variant-numeric:tabular-nums}
.kpi span{font-size:.75em;color:var(--muted)}
.tscroll{overflow-x:auto;border:2px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:.78em;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-family:var(--f-title);color:var(--title)}
.comments{display:grid;gap:8px}
.comments div{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.8em}
footer{margin-top:40px;font-size:.72em;color:var(--muted);display:grid;gap:8px;border-top:2px solid var(--line);padding-top:14px}
.linkbtn{font:inherit;background:none;border:0;color:var(--aqua);text-decoration:underline;cursor:pointer;padding:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--on-lime);border:3px solid var(--ink);border-radius:14px;padding:.5em 1em;font-family:var(--f-title);font-weight:700;z-index:20;max-width:calc(100% - 32px)}

/* Background video: clear behind the welcome screen, heavily veiled behind lessons */
#bgv{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#000}
#bgv video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05)}
#bgv .veil{position:absolute;inset:0;background:var(--ground);opacity:.86;transition:opacity .8s ease}
body.v-hero #bgv .veil{opacity:.66}
body.v-hero .hero{text-shadow:0 2px 16px var(--ground),0 0 4px var(--ground)}
body.v-hero .hero .says,body.v-hero .hero .chip,body.v-hero .hero .btn{text-shadow:none}
.hero h1{font-size:clamp(52px,10vw,104px);line-height:.98}
.hero p.lead{font-size:clamp(20px,2.4vw,28px)}
/* Soft pop-up entrance, one piece after another */
@keyframes softpop{0%{opacity:0;transform:translateY(18px) scale(.94)}60%{opacity:1;transform:translateY(-3px) scale(1.015)}100%{opacity:1;transform:none}}
.hero > *{animation:softpop .7s cubic-bezier(.2,.8,.3,1.2) both}
.hero > *:nth-child(1){animation-delay:.05s}.hero > *:nth-child(2){animation-delay:.18s}.hero > *:nth-child(3){animation-delay:.34s}
.hero > *:nth-child(4){animation-delay:.5s}.hero > *:nth-child(5){animation-delay:.64s}.hero > *:nth-child(6){animation-delay:.78s}.hero > *:nth-child(7){animation-delay:.9s}
body.v-hero #doodles{display:none}
html{background:var(--ground)} body{background:transparent}
body::before{content:"";position:fixed;inset:0;background:var(--ground);z-index:-1}

/* Illustrations and visual cards */
svg.ill{display:block;width:100%;height:auto;border-radius:12px;flex:none}
.flip,.flip .in{min-height:590px}
.front svg.ill{margin-bottom:4px;width:100%;max-width:300px;align-self:center}
.back svg.back-ill{margin-block:2px 4px;width:100%;max-width:290px;align-self:center}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.vcard{margin:0;background:var(--sticker);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:6px 6px 0 var(--shadow);display:grid;gap:12px;align-content:start;min-width:0}
.vcard .k{font-family:var(--f-title);font-weight:700;font-size:.7em;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.vcard h3{font-size:1.2em;margin-top:2px}
.vcard figcaption{display:grid;gap:6px;font-size:.86em}
.vcard .lead2{font-weight:700;color:var(--teal)}
.vcard .limit2{font-size:.85em;color:var(--sticker-sub);border-top:2px dashed #cfd8e3;padding-top:6px}
@keyframes jig{0%,100%{transform:translate(0,0)}25%{transform:translate(.8px,-.6px)}75%{transform:translate(-.8px,.6px)}}
@keyframes jig2{0%,100%{transform:translate(0,0)}50%{transform:translate(2.5px,-1.5px)}}
@keyframes jig3{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-4px)}}
.ill .jig{animation:jig .35s linear infinite}
.ill .jig2{animation:jig2 1.4s ease-in-out infinite}
.ill .jig3{animation:jig3 1.1s ease-in-out infinite}
.ill circle.jig2:nth-of-type(odd),.ill circle.jig3:nth-of-type(odd){animation-delay:-.6s}
/* Drag and drop */
.item{touch-action:none;user-select:none;-webkit-user-select:none}
.item.dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:rotate(-4deg) scale(1.08);box-shadow:8px 10px 0 var(--shadow)}
.bin.over{border-style:solid;border-color:var(--lime);background:color-mix(in srgb,var(--lime) 14%,transparent);transform:scale(1.02)}
.bin.pop{animation:pop .45s ease}
.bin.shake{animation:shake .4s ease;border-color:var(--coral)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

@media (max-width:640px){ .brand span{display:none} .tools{width:100%} .atomwrap{grid-template-columns:1fr} .mgrid{gap:6px} .flip,.flip .in{min-height:500px} }
@media (prefers-reduced-motion: reduce){
  .ill .jig,.ill .jig2,.ill .jig3,.bin.pop,.bin.shake,.hero > *{animation:none}
  #doodles svg{animation:none}
  .btn,.stop,.btn:nth-of-type(even),.stop:nth-child(odd),.stop:nth-child(even){transform:none!important;transition:none}
  .flip .in{transition:none}
}

<script>
/* ---------------- Content ---------------- */
const STOPS = [
{ id:"s0", num:"Prelude", title:"What is everything made of?", topic:"Matter and its states",
  hook:"Why can you smell durian from the next room?",
  tip:"Picture a class of students. How they sit, walk or run is exactly how particles behave in solids, liquids and gases.",
  core:[
    {t:"Matter", a:"Anything you can touch, hold or fill a space with is matter: your phone, your teh tarik, even the air inside a balloon.", s:"Matter is anything that has mass and takes up space.", l:"Light and sound are not matter, even though you can see and hear them."},
    {t:"Particles", a:"Zoom into a grain of sugar far enough and you would see tiny beads, far too small for a normal microscope.", s:"All matter is made of tiny particles (atoms, molecules or ions) that are always moving.", l:"A particle of sugar is not a tiny sweet crystal. Single particles have no colour or taste of their own."},
    {t:"Solid, liquid, gas", a:"Solid: students seated in exam rows. Liquid: students walking in a busy corridor. Gas: students running freely on the field at recess.", s:"Solid particles are packed in fixed places and only vibrate. Liquid particles are close but slide past each other. Gas particles are far apart and move fast in all directions.", l:"Between gas particles there is empty space, not air. And real particles are far smaller and faster than any student."},
    {t:"Changing state", a:"Give the students energy and they leave their seats. Take the energy away and they sit down again.", s:"Heating gives particles energy to break free: melting (solid to liquid) and boiling (liquid to gas). Cooling reverses it: condensing and freezing.", l:"Not everything melts. Paper and wood burn or break down before they can melt."},
    {t:"Why you smell durian", a:"Smell particles escape from the durian and spread out, like a crowd slowly filling an empty hall.", s:"Diffusion is the spreading of particles from where there are many to where there are few. Gas particles move fast, so a smell travels across a room quickly.", l:"In a still room, smells also ride on moving air, so diffusion is not the only reason."}
  ],
  acts:[{type:"sort", title:"Sort It: solid, liquid or gas?", bins:["Solid","Liquid","Gas"],
    items:[["Ice cube","Solid","Particles locked in place, like students seated in exam rows."],["Cooking oil","Liquid","It flows and takes the shape of the bottle, like students in a corridor."],["Steam from a kettle","Gas","Water particles spread far apart and move fast."],["Grain of rice","Solid","It keeps its own shape."],["Soy sauce","Liquid","It pours and flows."],["Oxygen we breathe","Gas","You cannot see it, but it fills the room."],["Gold ring","Solid","Metal particles are packed tightly in fixed places."],["Durian smell","Gas","Smell particles travel through the air."],["Honey","Liquid","Thick and slow, but it still flows."]]}],
  deeper:[
    {t:"Evaporation vs boiling", a:"Why do wet clothes dry on the line without ever boiling?", s:"Evaporation happens at the surface at any temperature, when the fastest particles escape. Boiling happens all through the liquid, at the boiling point (100 °C for pure water at sea level).", l:"Wind and sunshine speed up evaporation by carrying escaped particles away and adding energy."},
    {t:"Melting point as an ID", a:"Every pure substance melts at its own temperature, like a fingerprint.", s:"Pure ice always melts at 0 °C. Chemists measure melting points to check that a substance is pure. Pharmacy link: medicine makers use melting points as one quality check for drug ingredients.", l:"Impurities usually lower the melting point and spread it over a range."},
    {t:"The heating curve", a:"Heat ice steadily and watch the thermometer. Twice, it stops rising.", s:"While ice melts (0 °C) and while water boils (100 °C), the heat goes into pulling particles apart, not into raising the temperature. That is why the line goes flat.", l:"The flat parts are at 0 °C and 100 °C only for pure water at sea level."}
  ],
  side:[
    {t:"Why sweating cools you", a:"On a hot day, sweat is your body's built-in air-conditioner.", s:"When sweat evaporates, the fastest particles leave your skin and take energy with them, so your skin cools down.", l:"In very humid weather, sweat evaporates slowly, so you feel hotter and sticky."},
    {t:"The puffy chip packet", a:"Why does a sealed packet of chips puff up when you drive to Cameron Highlands?", s:"Higher up, the air pressure outside is lower. The gas sealed inside pushes outward and the packet swells.", l:"Bring it back down and the packet relaxes again."}
  ],
  check:[
    {q:"Which of these is NOT matter?", o:["Air","Water","Light","Sand"], a:2, h:"Matter has mass and takes up space. Which one has no mass?", w:"Light has no mass, so it is not matter. Air, water and sand all are."},
    {q:"In which state are particles far apart and moving fast?", o:["Solid","Liquid","Gas"], a:2, h:"Think of the students running on the field at recess.", w:"Gas particles are far apart and move quickly in all directions."},
    {q:"Ice turning into water is called…", o:["Boiling","Melting","Freezing","Condensing"], a:1, h:"Solid to liquid: the students leave their exam seats.", w:"Melting is solid to liquid."},
    {q:"You smell perfume from across the room because…", o:["The air pushes your nose","Perfume particles spread out by diffusion","Perfume turns into a solid","Light carries the smell"], a:1, h:"Particles move from where there are many to where there are few.", w:"Perfume particles diffuse through the air and reach your nose."},
    {q:"Wet clothes dry without boiling because…", o:["Water boils at room temperature","Surface particles evaporate at any temperature","Sunlight removes the water","Clothes absorb the water"], a:1, h:"The fastest particles at the surface can escape even when it is not hot.", w:"Evaporation happens at the surface at any temperature."}
  ]},

{ id:"s1", num:"Stop 1", title:"What's the Matter?", topic:"Atoms, elements and the periodic table",
  hook:"If everything is made of particles, why are gold, water and air so different?",
  tip:"Think LEGO. A few kinds of bricks build everything, and how you join them changes what you get.",
  core:[
    {t:"Atom", a:"A LEGO brick. Every material in the world is built from a small set of brick types.", s:"An atom is the smallest particle of an element that still keeps that element's identity.", l:"Atoms are not solid little balls, and you cannot snap them apart by hand."},
    {t:"Element", a:"A box that holds only one kind of LEGO brick.", s:"An element is a pure substance made of only one kind of atom. About 118 elements are known.", l:"Some elements exist as pairs of the same atom, such as oxygen gas (O₂). They are still one element."},
    {t:"Chemical symbols", a:"Short nicknames: H for hydrogen, O for oxygen. Some come from Latin: Na (natrium) is sodium and Fe (ferrum) is iron.", s:"Every element has a one- or two-letter symbol. The first letter is always a capital.", l:"Capitals matter: Co is cobalt, but CO is carbon monoxide, a compound."},
    {t:"Compound", a:"Letters make words. The letters H and O make the word H₂O.", s:"A compound is two or more elements chemically joined in a fixed ratio. It behaves differently from its elements: sodium (a reactive metal) and chlorine (a poisonous gas) join to make table salt.", l:"Unlike letters on a page, you cannot pull a compound apart just by picking at it."},
    {t:"Mixture", a:"Nasi campur: rice, chicken and sambal share a plate, and you can still pick them apart.", s:"A mixture is substances mixed but not chemically joined. They keep their own properties and can be separated by filtering, evaporating or other physical means.", l:"Some mixtures look like one substance, such as air or sugar water."},
    {t:"The periodic table", a:"A school seating plan where students in the same column share similar habits.", s:"Elements are arranged by atomic number. Elements in the same column (group) behave alike: sodium and potassium both react strongly with water.", l:"The table is a map of patterns, not a list to memorise all at once."}
  ],
  acts:[
    {type:"match", title:"Memory Match: symbol and name", pairs:[["H","Hydrogen"],["O","Oxygen"],["C","Carbon"],["N","Nitrogen"],["Na","Sodium"],["Fe","Iron"],["Ca","Calcium"],["Cl","Chlorine"]]},
    {type:"sort", title:"Sort It: element, compound or mixture?", bins:["Element","Compound","Mixture"],
     items:[["Gold","Element","Only one kind of atom, gold atoms."],["Water","Compound","Hydrogen and oxygen chemically joined: H₂O."],["Air","Mixture","Nitrogen, oxygen and other gases just mixed together."],["Table salt","Compound","Sodium and chlorine chemically joined."],["Oxygen gas","Element","Only oxygen atoms, in pairs."],["Teh tarik","Mixture","Tea, milk, sugar and water mixed, not joined."],["Iron nail","Element","Only iron atoms."],["Sugar","Compound","Carbon, hydrogen and oxygen joined in a fixed ratio."],["Seawater","Mixture","Salt dissolved in water. Boil it off and the salt is left."]]}
  ],
  deeper:[
    {t:"The elements in you", a:"Your body is mostly built from four bricks.", s:"By mass, roughly 65% of your body is oxygen, then carbon (about 18%), hydrogen (about 10%) and nitrogen (about 3%). Most of the oxygen and hydrogen are in water.", l:"Small amounts of other elements, like calcium and iron, are still essential."},
    {t:"Metals and non-metals", a:"The left side of the seating plan is the metal club; the right side is the non-metal club.", s:"Metals are usually shiny, bend without breaking and conduct electricity. Non-metals are usually dull, brittle as solids and do not conduct.", l:"Some elements near the border, such as silicon, behave a bit like both."}
  ],
  side:[
    {t:"Elements in your phone", a:"Your phone is a pocket-sized periodic table.", s:"Lithium powers the battery, silicon runs the chips, and copper and gold carry signals through the wiring.", l:"These are mined from the Earth, which is one reason phone recycling matters."},
    {t:"Iron in your blood", a:"Iron is the hand that holds oxygen as blood carries it around your body.", s:"Iron sits inside haemoglobin, the protein in red blood cells that carries oxygen. Too little iron can make you feel tired.", l:"This is for learning only. For your health, ask a pharmacist or doctor."}
  ],
  check:[
    {q:"Which of these is an element?", o:["Water","Oxygen gas","Table salt","Air"], a:1, h:"An element is a box with only one kind of brick.", w:"Oxygen gas is made of only oxygen atoms."},
    {q:"Water (H₂O) is a…", o:["Element","Compound","Mixture"], a:1, h:"Two different letters joined into one word.", w:"Water is hydrogen and oxygen chemically joined, so it is a compound."},
    {q:"Teh tarik is a mixture because…", o:["It is hot","Its parts are mixed, not chemically joined","It contains water","It has only one kind of atom"], a:1, h:"Think nasi campur: things sharing a plate.", w:"Tea, milk, sugar and water are mixed but not chemically joined."},
    {q:"The symbol Na stands for…", o:["Nitrogen","Neon","Sodium","Nickel"], a:2, h:"It comes from the Latin name natrium.", w:"Na is sodium, from the Latin natrium."},
    {q:"Elements in the same column of the periodic table…", o:["Have the same mass","Behave in similar ways","Are all gases","Are always metals"], a:1, h:"Remember the seating plan: same column, similar habits.", w:"Elements in the same group behave alike."}
  ]},

{ id:"s2", num:"Stop 2", title:"Why do atoms behave differently?", topic:"Inside the atom: protons, neutrons, electrons and shells",
  hook:"Why do fireworks come in different colours?",
  tip:"The outer electrons are the ones who reach out to hold hands. Keep your eye on them; they explain almost everything in bonding.",
  core:[
    {t:"Inside an atom", a:"A stadium with a tiny marble on the centre spot (the nucleus) and a few flies buzzing around the stands (the electrons).", s:"The nucleus holds protons (positive) and neutrons (no charge). Electrons (negative) move around the nucleus. An atom is mostly empty space.", l:"Electrons do not fly in neat paths; they are found in regions around the nucleus."},
    {t:"Atomic number", a:"An atom's MyKad number: it tells you exactly which element it is.", s:"The atomic number is the number of protons. Six protons is always carbon; eight is always oxygen.", l:"Unlike MyKad, every atom of the same element shares the same number."},
    {t:"A neutral atom", a:"A balanced scale: the positives and negatives cancel out.", s:"In a neutral atom, the number of electrons equals the number of protons.", l:"Atoms can gain or lose electrons to become ions. You will meet them at Stop 3."},
    {t:"Electron shells", a:"Rows of seats in a cinema. The front row fills first. Row 1 holds 2, and rows 2 and 3 hold 8 each (for the first 20 elements).", s:"Electrons sit in shells around the nucleus. Sodium has 11 electrons, arranged 2.8.1.", l:"After calcium, the filling order gets more complicated. PHD115 will show you why."},
    {t:"Valence electrons", a:"The people in the back row. They are the ones who reach out to hold hands with neighbours.", s:"Electrons in the outermost shell are valence electrons. They decide how an atom reacts and bonds.", l:"Atoms do not want things; we say it that way only to make the idea easier."},
    {t:"Fireworks colours", a:"Heat lifts electrons to a higher row. When they drop back, they give out light. Each element's rows are spaced differently, so each one shines its own colour.", s:"Sodium gives yellow, strontium gives red and copper gives blue-green. Chemists use this in flame tests to identify metals.", l:"A firework's final colour also depends on the other chemicals mixed in."}
  ],
  acts:[{type:"atom", title:"Atom Builder", targets:[["H","Hydrogen",1,0,1],["C","Carbon",6,6,6],["O","Oxygen",8,8,8],["Na","Sodium",11,12,11]]}],
  deeper:[

    {t:"Mass number", a:"Count everything in the nucleus.", s:"Mass number = protons + neutrons. Sodium-23 has 11 protons and 12 neutrons. Electrons are so light that we leave them out.", l:"The mass shown on a periodic table is an average over the natural isotopes, so it is often not a whole number."},

  ],
  side:[
    {t:"Orange street lights", a:"Some older street lights glow orange-yellow. That is sodium's colour.", s:"Inside these lamps, electricity lifts sodium's electrons; as they drop back, they give out yellow-orange light.", l:"Many towns now use LED lights, which work differently."},
    {t:"Isotopes in medicine", a:"Pharmacy link: some medicines carry special isotopes, like a tracking tag.", s:"Radioactive iodine is used to diagnose and treat some thyroid conditions, because the thyroid gland collects iodine.", l:"This is for learning only. For your health, ask a pharmacist or doctor."}
  ],
  check:[

    {q:"The atomic number tells you the number of…", o:["Neutrons","Protons","Shells","Atoms"], a:1, h:"It is the atom's MyKad number, the thing that never changes.", w:"Atomic number = number of protons."},
    {q:"Oxygen has 8 electrons. How are they arranged?", o:["8","2.6","2.8","4.4"], a:1, h:"The front row holds only 2.", w:"2 in the first shell and 6 in the second: 2.6."},
    {q:"Valence electrons are found in…", o:["The nucleus","The first shell","The outermost shell"], a:2, h:"The back row of the cinema.", w:"Valence electrons are in the outermost shell."},
    {q:"Fireworks have different colours because…", o:["Of different paper wrappers","Electrons drop back and give out light of each element's colour","Protons burn","The sky reflects the light"], a:1, h:"Heat lifts electrons up; what happens when they come back down?", w:"Electrons falling back give out light, and each element has its own colour."}
  ]},
{ id:"s3", num:"Stop 3", title:"Why do atoms gain or lose electrons?", topic:"Ions and the octet rule",
  hook:"Why do sports drinks say \"electrolytes\" on the bottle?",
  tip:"Atoms are happiest with a full back row of electrons. Some give electrons away and some take them, just to feel complete.",
  core:[
    {t:"The happy full row", a:"A finished puzzle: every piece in place, nothing missing, nothing extra.", s:"Atoms with a full outer shell are stable and hardly react. These are the noble gases, such as helium, neon and argon. That is why helium in party balloons never burns."},
    {t:"The octet rule", a:"A cinema back row with 8 seats. Atoms feel complete when all 8 seats are filled.", s:"Most atoms react so that their outer shell ends up with 8 electrons, like a noble gas. \"Octet\" means a group of 8. Hydrogen and helium are the exception: 2 is enough for them."},
    {t:"Losing electrons: + ions", a:"Sodium has one lonely electron in its back row. Giving it away is easier than finding 7 more.", s:"When an atom loses electrons, it has more protons (+) than electrons (−), so it becomes a positive ion. Sodium (Na) loses 1 electron and becomes Na⁺."},
    {t:"Gaining electrons: − ions", a:"Chlorine's back row has 7 of its 8 seats filled. It just needs one more friend.", s:"When an atom gains electrons, it has more electrons than protons, so it becomes a negative ion. Chlorine (Cl) gains 1 electron and becomes Cl⁻, called chloride."},
    {t:"Naming ions", a:"Negative ions get a nickname ending: chlorine becomes chloride.", s:"Positive metal ions keep their name: the sodium ion, Na⁺. Negative ions end in \"-ide\": chloride (Cl⁻), oxide (O²⁻) and fluoride (F⁻). That is why toothpaste says \"fluoride\"."},
    {t:"Why drinks say \"electrolytes\"", a:"Your body is like a phone that runs on tiny charged particles.", s:"Electrolytes are ions dissolved in body fluids, such as Na⁺, K⁺ and Cl⁻. They carry the electrical signals for your nerves and muscles. Sweating loses some, so sports drinks put them back."}
  ],
  acts:[
    {type:"sort", title:"Sort It: give, take or stay?", bins:["Gives electrons","Takes electrons","Stays happy"],
     items:[["Sodium, Na","Gives electrons","1 lonely outer electron: easier to give it away. It becomes Na⁺."],["Potassium, K","Gives electrons","Same column as sodium: gives 1 electron and becomes K⁺."],["Magnesium, Mg","Gives electrons","2 outer electrons to give away. It becomes Mg²⁺."],["Calcium, Ca","Gives electrons","Gives 2 electrons and becomes Ca²⁺."],["Chlorine, Cl","Takes electrons","7 outer electrons: takes 1 more and becomes Cl⁻."],["Oxygen, O","Takes electrons","6 outer electrons: takes 2 more and becomes O²⁻."],["Fluorine, F","Takes electrons","7 outer electrons: takes 1 and becomes F⁻."],["Helium, He","Stays happy","Its shell is already full, so it does not react."],["Neon, Ne","Stays happy","A noble gas with a full outer shell."],["Argon, Ar","Stays happy","A noble gas: full shell, no need to change."]]},
    {type:"match", title:"Memory Match: ion and its name", pairs:[["Na⁺","Sodium ion"],["K⁺","Potassium ion"],["Ca²⁺","Calcium ion"],["Cl⁻","Chloride"],["O²⁻","Oxide"],["F⁻","Fluoride"]]}
  ],
  deeper:[
    {t:"The charge follows the column", a:"The periodic table tells you each ion's charge.", s:"Group 1 metals (Li, Na, K) form +1 ions and Group 2 metals (Mg, Ca) form +2. On the right, Group 16 (O, S) form −2 and Group 17 (F, Cl) form −1. Noble gases form no ions."},
    {t:"Copying a noble gas", a:"After the change, each ion has the same electron pattern as a noble gas.", s:"Na (2.8.1) loses 1 electron to become Na⁺ (2.8), the same pattern as neon. Cl (2.8.7) gains 1 to become Cl⁻ (2.8.8), the same as argon."}
  ],
  side:[
    {t:"Oral rehydration salts", a:"Pharmacy link: a small sachet that refills your body's ions.", s:"During diarrhoea the body loses water and ions. Oral rehydration salts mix sodium, potassium, chloride and glucose in a careful balance, so the gut can soak the water back up. For your health, ask a pharmacist or doctor."},
    {t:"Fluoride in toothpaste", a:"A tiny ion that makes your teeth tougher.", s:"Fluoride ions (F⁻) join the mineral of tooth enamel and make it harder for the acids from sweets and fizzy drinks to dissolve it."}
  ],
  check:[
    {q:"Why do noble gases like neon hardly react?", o:["They are very heavy","Their outer shell is already full","They have no electrons","They are always liquid"], a:1, h:"Think of the finished puzzle.", w:"Their outer shell is full, so they are already stable."},
    {q:"Sodium (2.8.1) loses 1 electron. What does it become?", o:["Na⁻","Na⁺","Na²⁺","Neon"], a:1, h:"Losing a negative electron leaves more positive protons.", w:"It becomes Na⁺: one more proton than electrons."},
    {q:"Chlorine gains 1 electron. Its ion is called…", o:["Chlorine ion","Chloride","Chlorate","Chlorine gas"], a:1, h:"Negative ions get the \"-ide\" ending.", w:"Cl⁻ is called chloride."},
    {q:"Which ion does magnesium (Group 2) form?", o:["Mg⁺","Mg²⁺","Mg⁻","Mg²⁻"], a:1, h:"Group 2 metals have 2 outer electrons to give away.", w:"Mg loses 2 electrons and becomes Mg²⁺."},
    {q:"Sports drinks contain electrolytes because…", o:["They make the drink sweeter","Ions help nerves and muscles work, and sweat removes some","They add colour","They make water boil faster"], a:1, h:"Remember the body running on tiny charged particles.", w:"Electrolytes are ions your nerves and muscles need, and sweat removes some."}
  ]},

{ id:"s4", num:"Stop 4", title:"How do atoms hold hands?", topic:"Chemical bonds: ionic and covalent",
  hook:"Why does tap water flow as one unbroken stream instead of breaking into drops?",
  tip:"A bond is atoms holding hands. Some hand over a gift, some share an umbrella. Either way, everyone ends up with a full back row.",
  core:[
    {t:"What is a chemical bond?", a:"Atoms holding hands so tightly that they move together as one team.", s:"A chemical bond is a strong attraction that holds atoms together. Atoms bond so that each one gets a full outer shell. The two main types are ionic and covalent."},
    {t:"Ionic bond: giving a gift", a:"Sodium hands its one electron to chlorine like a gift. Now one is + and one is −, and opposites stick like magnets.", s:"An ionic bond forms when a metal gives electrons to a non-metal. The + and − ions then attract each other strongly. Table salt (NaCl) is held together by ionic bonds."},
    {t:"Covalent bond: sharing an umbrella", a:"Two friends in the rain share one umbrella, so both stay dry.", s:"A covalent bond forms when two non-metal atoms share a pair of electrons. Each atom counts the shared pair as its own, so both get a full shell. Water and sugar have covalent bonds."},
    {t:"Double bonds", a:"Holding hands with both hands for a stronger grip.", s:"Some atoms share two pairs of electrons: a double bond. The two atoms in oxygen gas (O₂) share two pairs. In carbon dioxide (CO₂), carbon makes a double bond with each oxygen."},
    {t:"Polar water", a:"Oxygen is a blanket hog. It pulls the shared electrons closer and leaves the hydrogens a little cold.", s:"In water, oxygen pulls the shared electrons more strongly. The oxygen end becomes slightly negative (δ−) and the hydrogen ends slightly positive (δ+). We call this a polar molecule."},
    {t:"Hydrogen bonds", a:"Water molecules hold hands with their neighbours, so the stream stays together like a line of friends.", s:"The δ+ hydrogen of one water molecule is attracted to the δ− oxygen of the next. These hydrogen bonds pull water molecules together, so a thin stream from the tap stays unbroken and drops stay round."}
  ],
  acts:[
    {type:"sort", title:"Sort It: ionic or covalent?", bins:["Ionic (gift)","Covalent (sharing)"],
     items:[["Table salt, NaCl","Ionic (gift)","Metal sodium gives an electron to non-metal chlorine."],["Water, H₂O","Covalent (sharing)","Only non-metals: H and O share electrons."],["Carbon dioxide, CO₂","Covalent (sharing)","C and O are both non-metals, so they share."],["Magnesium oxide, MgO","Ionic (gift)","Metal magnesium gives 2 electrons to oxygen."],["Cooking gas (methane), CH₄","Covalent (sharing)","C and H share electrons."],["Potassium chloride, KCl","Ionic (gift)","Metal potassium gives an electron to chlorine."],["Oxygen gas, O₂","Covalent (sharing)","Two identical non-metal atoms share."],["Quicklime, CaO","Ionic (gift)","Metal calcium gives electrons to oxygen."],["Ammonia, NH₃","Covalent (sharing)","N and H share electrons."]]},
    {type:"match", title:"Memory Match: formula and name", pairs:[["H₂O","Water"],["CO₂","Carbon dioxide"],["CH₄","Methane"],["NH₃","Ammonia"],["NaCl","Table salt"],["O₂","Oxygen gas"]]}
  ],
  deeper:[
    {t:"Lewis dot pictures", a:"Draw only the outer electrons, as dots. Shared pairs sit between the atoms.", s:"In H₂O, oxygen shares one pair with each hydrogen and keeps two lone pairs. Count the dots around oxygen: 8. Around each hydrogen: 2. Everyone has a full shell. You will draw many of these in PHD115."},
    {t:"Ionic vs covalent: melting points", a:"Ionic crystals are hard to pull apart. Small covalent molecules let go of each other easily.", s:"Salt (ionic) melts at 801 °C. Substances made of separate covalent molecules melt much lower: sugar at about 186 °C, candle wax at about 60 °C and ice at 0 °C."}
  ],
  side:[
    {t:"Insects that walk on water", a:"Pond skaters stand on a pond as if it were a trampoline.", s:"Hydrogen bonds pull the surface water molecules tightly together, making a thin \"skin\" called surface tension. Light insects can stand on it without sinking."},
    {t:"How soap cleans oil", a:"Soap is a two-faced molecule: one end loves water, the other end loves oil.", s:"The oil-loving tails of soap grab the grease, while the water-loving heads face outwards. Together they wrap the oil in tiny balls that rinse away with water."}
  ],
  check:[
    {q:"A chemical bond is…", o:["A glue we add to atoms","A strong attraction holding atoms together","A type of atom","Heat energy"], a:1, h:"Atoms holding hands.", w:"A bond is the attraction that holds atoms together."},
    {q:"In an ionic bond, electrons are…", o:["Shared equally","Given from a metal to a non-metal","Destroyed","Turned into protons"], a:1, h:"Think of handing over a gift.", w:"A metal gives electrons to a non-metal, making + and − ions."},
    {q:"Which substance has covalent bonds?", o:["Table salt, NaCl","Water, H₂O","Magnesium oxide, MgO","Potassium chloride, KCl"], a:1, h:"Look for a substance made only of non-metals.", w:"Water is made only of non-metals that share electrons."},
    {q:"Oxygen gas (O₂) has a double bond. This means…", o:["Two atoms share two pairs of electrons","Two molecules join together","The atoms become ions","Oxygen has two nuclei"], a:0, h:"Holding hands with both hands.", w:"A double bond is two shared pairs of electrons."},
    {q:"A thin stream of tap water stays unbroken mainly because of…", o:["Ionic bonds","Hydrogen bonds between water molecules","Gravity alone","Air pressure"], a:1, h:"Water molecules holding hands with their neighbours.", w:"Hydrogen bonds pull neighbouring water molecules together."}
  ]}
,
{ id:"s4b", num:"Stop 4B", title:"Why is carbon in almost everything?", topic:"Carbon, the LEGO master (a first look at organic chemistry)",
  hook:"Why is cooking gas a gas, cooking oil a liquid and candle wax a solid?",
  tip:"Carbon is the LEGO master. With four hands it can build chains, branches and rings of almost any size.",
  core:[
    {t:"Carbon has four hands", a:"A LEGO brick with four studs: it can click onto four other pieces at once.", s:"Carbon has 4 outer electrons, so it makes 4 covalent bonds. It can also bond to other carbon atoms again and again. That is why there are millions of different carbon compounds."},
    {t:"Short chains, long chains", a:"A short LEGO chain is easy to pull apart; a long one tangles and holds on.", s:"Molecules made of only carbon and hydrogen are called hydrocarbons. Short chains like methane (1 carbon, cooking gas) are gases. Longer chains like petrol (about 8 carbons) are liquids. Very long chains like candle wax (20 to 40 carbons) are solids."},
    {t:"Branches and rings", a:"LEGO pieces can be built straight, with branches, or joined into a circle.", s:"Carbon chains can branch, or close up into rings. A flat ring of 6 carbons, called a benzene ring, is found in many medicines, including aspirin and paracetamol."},
    {t:"Functional groups", a:"Accessories that give a molecule its personality, like a hat or a scarf.", s:"A small group of atoms on a carbon chain changes how it behaves. –OH makes an alcohol, like the ethanol in hand sanitiser. –COOH makes an acid, like the acetic acid in vinegar. Esters give fruits their sweet smell."},
    {t:"Isomers", a:"The same LEGO pieces, built into a different shape.", s:"Isomers have the same atoms arranged differently, so they behave differently. Carvone comes in two mirror-image forms: one smells of spearmint and the other of caraway seeds."},
    {t:"Organic is all around you", a:"Carbon is in almost everything you eat, wear and take.", s:"Organic chemistry is the chemistry of carbon compounds. Sugar, proteins, DNA, plastics, petrol, soap and most medicines are organic. Here, \"organic\" does not mean \"grown without pesticides\"."}
  ],
  acts:[
    {type:"sort", title:"Sort It: gas, liquid or solid?", bins:["Gas","Liquid","Solid"],
     items:[["Methane (cooking gas), 1 C","Gas","A very short chain: molecules let go of each other easily."],["Propane, 3 C","Gas","Short chain, so it is a gas at room temperature."],["Butane (lighter fuel), 4 C","Gas","Still short: a gas, kept liquid only under pressure in the lighter."],["Petrol, about 8 C","Liquid","Medium chains: they cling enough to be a liquid."],["Kerosene, about 12 C","Liquid","Medium-long chains, still a liquid."],["Diesel, about 16 C","Liquid","Longer chains: a thicker liquid."],["Candle wax, 20 to 40 C","Solid","Long chains tangle and hold tight, so wax is solid."],["Plastic bag, thousands of C","Solid","Polyethylene: enormous chains, a tough solid."]]},
    {type:"match", title:"Memory Match: group and where you meet it", pairs:[["–OH","Alcohol (hand sanitiser)"],["–COOH","Acid (vinegar)"],["Ester","Fruity smell (banana)"],["Benzene ring","Ring in aspirin"],["CH₄","Cooking gas"],["C=C","Double bond"]]}
  ],
  deeper:[
    {t:"Longer chain, higher boiling point", a:"Every extra carbon adds a little more 'stickiness' between molecules.", s:"Methane (1 C) boils at −162 °C, propane (3 C) at −42 °C and butane (4 C) at about −1 °C, so they are gases. Octane (8 C) boils at 126 °C and hexadecane (16 C) at 287 °C, so they are liquids."},
    {t:"How chemists draw organic molecules", a:"A shortcut drawing: every corner is a carbon, and the hydrogens are left out.", s:"In a skeletal formula, each corner or line end is a carbon atom with enough hydrogens to make 4 bonds. Only other atoms, like O, are written. You will meet these drawings again in PHD115."}
  ],
  side:[
    {t:"From willow bark to aspirin", a:"Pharmacy link: a tree bark used for pain led chemists to a famous medicine.", s:"Willow bark contains salicin, which the body turns into salicylic acid. Chemists changed one functional group to make acetylsalicylic acid, called aspirin, which is gentler on the stomach. For your health, ask a pharmacist or doctor."},
    {t:"Why plastic stays for years", a:"A chain so long that nature has almost no scissors to cut it.", s:"A plastic bag is made of polyethylene: chains of thousands of carbon atoms. Very few living things have enzymes that can cut these chains, so plastic can stay in the environment for decades or even centuries."}
  ],
  check:[
    {q:"How many bonds does a carbon atom usually make?", o:["1","2","3","4"], a:3, h:"Think of the LEGO brick with four studs.", w:"Carbon has 4 outer electrons, so it makes 4 bonds."},
    {q:"Which of these is a solid at room temperature?", o:["Methane","Petrol","Candle wax","Butane"], a:2, h:"Longer chains hold on to each other more.", w:"Candle wax has very long chains (20 to 40 carbons), so it is solid."},
    {q:"The –OH group makes a molecule an…", o:["Acid","Alcohol","Ester","Ion"], a:1, h:"Think of hand sanitiser.", w:"–OH makes an alcohol, like ethanol in hand sanitiser."},
    {q:"Isomers have…", o:["Different atoms","The same atoms arranged differently","No carbon","Only one atom"], a:1, h:"The same LEGO pieces, a different shape.", w:"Isomers share the same atoms but in a different arrangement."},
    {q:"In chemistry, \"organic\" means…", o:["Grown without pesticides","Compounds of carbon","Anything natural","Only living things"], a:1, h:"Think of what sugar, petrol and aspirin share.", w:"Organic chemistry is the chemistry of carbon compounds."}
  ]}
,
{ id:"s5", num:"Stop 5", title:"How do we write a chemical recipe?", topic:"Chemical formulas and equations",
  hook:"Why does a gas stove need air to burn?",
  tip:"A formula is a list of ingredients. An equation is the whole recipe: what goes in, and what comes out.",
  core:[
    {t:"A formula is an ingredient list", a:"A shopping list for one molecule: which atoms, and how many.", s:"A chemical formula shows the elements in a substance and how many atoms of each. The small number after a symbol counts its atoms: H₂O has 2 hydrogen atoms and 1 oxygen atom. No number means 1."},
    {t:"Big numbers in front", a:"\"2 packets of nasi lemak\": the number in front counts whole packets, not what is inside.", s:"A number in front of a formula counts whole molecules. 2H₂O means two water molecules, so 4 hydrogen atoms and 2 oxygen atoms in total. Never change the small numbers, or you make a different substance."},
    {t:"An equation is a recipe", a:"Flour + eggs + sugar → cake. Ingredients on the left, the dish on the right.", s:"A chemical equation shows a reaction. The starting substances (reactants) are on the left, the arrow means \"react to make\", and the new substances (products) are on the right. Example: hydrogen + oxygen → water."},
    {t:"Balancing: no atom goes missing", a:"Pull a LEGO house apart and build a car: you still have the very same bricks.", s:"Atoms are never created or destroyed in a reaction, only rearranged. So both sides must have the same number of each atom. We balance by changing the big numbers in front: 2H₂ + O₂ → 2H₂O."},
    {t:"Signs of a reaction", a:"Clues that something new has been made, like a detective's checklist.", s:"Common signs of a chemical reaction are gas bubbles, a colour change, heat or light, a new smell, or a solid appearing in a liquid. Baking soda and vinegar fizzing is a reaction you can see."},
    {t:"Why a gas stove needs air", a:"A fire is a recipe too, and oxygen from the air is one of its ingredients.", s:"Cooking gas (methane) burns with oxygen: CH₄ + 2O₂ → CO₂ + 2H₂O + energy. Without enough air, the flame turns yellow and can make soot and harmful carbon monoxide. That is why kitchens need good airflow."}
  ],
  acts:[
    {type:"balance", title:"Balance It", eqs:[
      {r:[["H₂",{H:2}],["O₂",{O:2}]], p:[["H₂O",{H:2,O:1}]], ans:[2,1,2], name:"making water"},
      {r:[["N₂",{N:2}],["H₂",{H:2}]], p:[["NH₃",{N:1,H:3}]], ans:[1,3,2], name:"making ammonia"},
      {r:[["Na",{Na:1}],["Cl₂",{Cl:2}]], p:[["NaCl",{Na:1,Cl:1}]], ans:[2,1,2], name:"making table salt"},
      {r:[["CH₄",{C:1,H:4}],["O₂",{O:2}]], p:[["CO₂",{C:1,O:2}],["H₂O",{H:2,O:1}]], ans:[1,2,1,2], name:"burning cooking gas"}]},
    {type:"sort", title:"Sort It: chemical or physical change?", bins:["Chemical change","Physical change"],
     items:[["Burning paper","Chemical change","Ash and smoke are new substances."],["Ice melting","Physical change","Still water, just a different state."],["Iron rusting","Chemical change","Rust is a new substance: iron oxide."],["Frying an egg","Chemical change","The egg's proteins change for good."],["Sugar dissolving in tea","Physical change","The sugar is still there; you can taste it."],["Baking soda + vinegar fizz","Chemical change","Bubbles of a new gas, carbon dioxide."],["Chopping vegetables","Physical change","Smaller pieces, same substance."],["Boiling water","Physical change","Steam is still water."],["Milk going sour","Chemical change","Bacteria make new acids: a new smell and taste."]]},
    {type:"match", title:"Memory Match: formula and its atoms", pairs:[["H₂O","2 H + 1 O"],["CO₂","1 C + 2 O"],["CH₄","1 C + 4 H"],["NH₃","1 N + 3 H"],["NaCl","1 Na + 1 Cl"],["C₆H₁₂O₆","6 C + 12 H + 6 O"]]}
  ],
  deeper:[
    {t:"Counting atoms in medicines", a:"Big molecules have long ingredient lists, but you read them the same way.", s:"Glucose is C₆H₁₂O₆: 24 atoms. Aspirin is C₉H₈O₄: 21 atoms. Paracetamol is C₈H₉NO₂: 20 atoms. Pharmacists meet these formulas on every medicine's information sheet."},
    {t:"Mass is saved", a:"Weigh a fizzing drink in a sealed bottle, and the scale does not move.", s:"In a closed container, the total mass before and after a reaction is the same, because no atoms escape. In an open cup, the gas floats away, so the mass seems to drop. This is the law of conservation of mass."}
  ],
  side:[
    {t:"Why cakes rise", a:"Tiny gas balloons trapped in the batter.", s:"Baking soda (sodium hydrogen carbonate, NaHCO₃) reacts with acids in the batter, or breaks down with heat, to make carbon dioxide gas. The bubbles get trapped and the cake rises."},
    {t:"Why bicycles rust", a:"Iron slowly \"burns\" with oxygen and water from the air.", s:"Iron reacts with oxygen and water to make rust, a reddish iron oxide: 4Fe + 3O₂ → 2Fe₂O₃ (water helps it along). Paint, oil and grease keep air and water away, so the iron stays shiny."}
  ],
  check:[
    {q:"How many hydrogen atoms are in one H₂O molecule?", o:["1","2","3","4"], a:1, h:"Look at the small number after H.", w:"The small 2 after H means 2 hydrogen atoms."},
    {q:"How many hydrogen atoms are in 2H₂O?", o:["2","3","4","6"], a:2, h:"Two whole water molecules, each with 2 H.", w:"2 molecules × 2 H = 4 hydrogen atoms."},
    {q:"In a chemical equation, the substances on the left are called…", o:["Products","Reactants","Catalysts","Ions"], a:1, h:"They are the starting ingredients.", w:"The starting substances, on the left, are the reactants."},
    {q:"Why must an equation be balanced?", o:["To make it look neat","Atoms are not created or destroyed","To make the reaction faster","Products are always heavier"], a:1, h:"Remember the LEGO bricks.", w:"Atoms are only rearranged, so each side must have the same atoms."},
    {q:"Which of these is a chemical change?", o:["Ice melting","Chopping onions","Frying an egg","Dissolving salt"], a:2, h:"Which one makes something new that you cannot undo?", w:"Frying changes the egg's proteins into something new."}
  ]}
,
{ id:"s6", num:"Stop 6", title:"How do chemists count tiny things?", topic:"The mole and concentration",
  hook:"How does a shop sell rice without counting every grain?",
  tip:"We measure length with a ruler and weight with a scale. For particles far too tiny to count, chemists use the mole.",
  core:[
    {t:"Why chemists need the mole", a:"A ruler measures length, a scale measures weight, a clock measures time. But what measures how many molecules there are?", s:"A single atom or molecule is far too tiny to see, count one by one, or put on a weighing scale. So chemists use a special unit, the mole (symbol: mol), to say how many particles of an element or compound there are."},
    {t:"A mole is a counting number", a:"A dozen always means 12, whether it is 12 eggs or 12 pencils.", s:"In the same way, 1 mole always means 6.02 × 10²³ particles (atoms, molecules or ions). This number is called Avogadro's number. 1 mole of water = 6.02 × 10²³ water molecules."},
    {t:"How big is a mole?", a:"Imagine everyone on Earth counting together, one particle each second.", s:"6.02 × 10²³ is 602 thousand billion billion. If all 8 billion people on Earth each counted one particle every second, it would take about 2.4 million years to count just one mole."},
    {t:"Weighing to count: molar mass", a:"A rice shop weighs 1 kg instead of counting grains. If you know how heavy one grain is, the weight tells you how many grains there are.", s:"Chemists do the same. One mole of a substance has a fixed mass, its molar mass, in grams. 1 mol of carbon is 12 g. 1 mol of water (H₂O) is 18 g: 1 + 1 + 16."},
    {t:"Concentration: people in a room", a:"Put 10 people in a small room and they are crowded. Put the same 10 people in a big hall and there is lots of space between them.", s:"Concentration tells how much of a substance is dissolved in a certain volume. Same amount in a smaller volume = more concentrated. It is often written in mol/L (moles per litre) or g/L."},
    {t:"Diluting: same sugar, bigger room", a:"One spoon of syrup tastes strong in a small glass but weak in a big jug.", s:"Adding more water does not remove any particles. The amount stays the same, but the volume grows, so the particles spread out and the concentration goes down. That is diluting."}
  ],
  acts:[
    {type:"sort", title:"Sort It: which tool measures it?", bins:["Ruler (length)","Scale (mass)","Mole (particles)"],
     items:[["Height of a door","Ruler (length)","Length is measured in metres with a ruler or tape."],["A bag of rice","Scale (mass)","Mass is measured in kilograms on a scale."],["Water molecules in a glass","Mole (particles)","Far too many and too tiny to count: chemists use moles."],["Width of your phone","Ruler (length)","A length, in centimetres."],["Sugar for a cake","Scale (mass)","Weighed in grams."],["Oxygen molecules in a balloon","Mole (particles)","Tiny particles: counted in moles."],["Salt particles in a spoon","Mole (particles)","Countless ions: chemists use moles."],["Your body weight","Scale (mass)","Measured in kilograms."]]},
    {type:"conc", title:"Concentration Room", rounds:[{n:8, target:2},{n:6, target:3},{n:12, target:1.5},{n:10, target:5}]},
    {type:"match", title:"Memory Match: unit and what it measures", pairs:[["m","Length"],["kg","Mass"],["s","Time"],["mol","Number of particles"],["mol/L","Concentration"],["°C","Temperature"]]}
  ],
  deeper:[
    {t:"Working out molar mass", a:"Add up the atoms, like adding prices on a receipt.", s:"Use each atom's mass from the periodic table: H = 1, C = 12, O = 16, Na = 23, Cl = 35.5. Water H₂O = 1 + 1 + 16 = 18 g/mol. Salt NaCl = 23 + 35.5 = 58.5 g/mol. Glucose C₆H₁₂O₆ = 72 + 12 + 96 = 180 g/mol."},
    {t:"Concentration in a hospital drip", a:"Pharmacy link: a drip bag is a carefully measured solution.", s:"Normal saline is 0.9% sodium chloride: 9 g of salt in every 1 litre (1000 mL). This matches the salt level of body fluids, so it does not harm blood cells. Getting concentration right is a daily job in pharmacy."}
  ],
  side:[
    {t:"One mole of water", a:"Smaller than you think: about one big spoonful.", s:"1 mole of water weighs 18 g and fills about 18 mL, just a little more than a tablespoon. Yet that spoonful holds 6.02 × 10²³ water molecules."},
    {t:"Blood sugar in mmol/L", a:"Your glucose meter is quietly using moles.", s:"In Malaysia, blood sugar meters show readings in mmol/L: millimoles of glucose per litre of blood. \"Milli\" means one-thousandth, so 1 mmol is 1/1000 of a mole. For your health, ask a pharmacist or doctor."}
  ],
  check:[
    {q:"Why do chemists not count single molecules on a scale?", o:["Molecules are too heavy","Molecules are far too tiny to see or weigh one by one","Scales are not allowed in labs","Molecules have no mass"], a:1, h:"Think about how small one molecule is.", w:"Single molecules are far too tiny, so chemists count them in moles."},
    {q:"1 mole of any substance contains…", o:["12 particles","1000 particles","6.02 × 10²³ particles","1 kg of particles"], a:2, h:"It is Avogadro's number.", w:"1 mole = 6.02 × 10²³ particles, like a dozen = 12."},
    {q:"What is the molar mass of water, H₂O? (H = 1, O = 16)", o:["17 g/mol","18 g/mol","32 g/mol","2 g/mol"], a:1, h:"Add 1 + 1 + 16.", w:"1 + 1 + 16 = 18 g/mol."},
